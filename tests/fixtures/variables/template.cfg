[gcode_macro _USER_VARIABLES]
## Klippain regenerates this file on update. Comments and formatting you add
## outside the shipped ones are replaced. Set the variable below to False to
## opt out.
variable_klippain_variables_autoupdate: True

## Speeds
variable_travel_speed: 350 # mm/s
variable_z_drop_speed: 15        # aligned comment

## Materials
variable_material_parameters: {
        'PLA': {'pressure_advance': 0.0525},
        'ABS': {'pressure_advance': 0.0480}
    }

## Do not remove the next line
gcode:
